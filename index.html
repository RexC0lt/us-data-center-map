<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>US Data Center Map</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css" />
  <style>
    html, body { margin: 0; height: 100%; }
    #map { height: 100%; }
    #panel {
      position: absolute; top: 10px; left: 60px; z-index: 1000;
      background: #fff; padding: 12px 16px; border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0,0,0,.2); font: 14px/1.4 system-ui, sans-serif;
      max-width: 280px; max-height: 80vh; overflow-y: auto;
    }
    #panel h1 { font-size: 16px; margin: 0 0 8px; }
    #panel label { display: block; margin: 4px 0; cursor: pointer; }
    .swatch { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 6px; }
    #count { margin-top: 8px; font-weight: 600; }
    .leaflet-popup-content { font: 13px/1.5 system-ui, sans-serif; max-width: 280px; }
  </style>
</head>
<body>
  <div id="map"></div>
  <div id="panel">
    <h1>US Data Centers</h1>
    <div id="filters"></div>
    <div id="count"></div>
  </div>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>
  <script>
    const TYPE_STYLE = {
      hyperscale: { color: '#dc2626', fill: '#ef4444', label: 'Hyperscale' },
      colo:       { color: '#2563eb', fill: '#3b82f6', label: 'Colocation' },
      mixed:      { color: '#7c3aed', fill: '#8b5cf6', label: 'Mixed market' },
      enterprise: { color: '#059669', fill: '#10b981', label: 'Enterprise' }
    };

    const map = L.map('map').setView([39.5, -98.35], 4);
    L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
      attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors',
      maxZoom: 19
    }).addTo(map);

    const clusters = L.markerClusterGroup();
    const layers = {};
    const filters = document.getElementById('filters');
    const countEl = document.getElementById('count');

    fetch('data/centers.geojson')
      .then(r => r.json())
      .then(data => {
        data.features.forEach(f => {
          const p = f.properties;
          const type = p.type || 'colo';
          const style = TYPE_STYLE[type] || TYPE_STYLE.colo;
          if (!layers[type]) {
            layers[type] = L.layerGroup();
            clusters.addLayer(layers[type]);
          }
          const m = L.circleMarker([f.geometry.coordinates[1], f.geometry.coordinates[0]], {
            radius: 7, color: style.color, weight: 1.5, fillColor: style.fill, fillOpacity: 0.75
          });
          m.bindPopup(
            '<b>' + p.name + '</b><br>' +
            p.city + ', ' + p.state + ' &middot; ' + style.label + '<br>' +
            '<b>Operators:</b> ' + (p.operator || 'n/a') + '<br>' +
            (p.note ? '<i>' + p.note + '</i><br>' : '') +
            '<small>Source: ' + p.source + '</small>'
          );
          layers[type].addLayer(m);
        });
        map.addLayer(clusters);
        Object.keys(TYPE_STYLE).forEach(type => {
          if (!layers[type]) return;
          const label = document.createElement('label');
          label.innerHTML = '<input type="checkbox" checked data-type="' + type + '">' +
            '<span class="swatch" style="background:' + TYPE_STYLE[type].fill + '"></span>' + TYPE_STYLE[type].label;
          filters.appendChild(label);
        });
        filters.addEventListener('change', e => {
          const type = e.target.dataset.type;
          if (!type) return;
          if (e.target.checked) clusters.addLayer(layers[type]);
          else clusters.removeLayer(layers[type]);
          updateCount();
        });
        updateCount();
      });

    function updateCount() {
      const total = Object.values(layers).reduce((a, l) => a + l.getLayers().length, 0);
      const visible = Object.entries(layers).reduce((a, [t, l]) => {
        const cb = document.querySelector('input[data-type="' + t + '"]');
        return a + (cb && cb.checked ? l.getLayers().length : 0);
      }, 0);
      countEl.textContent = visible + ' of ' + total + ' locations shown';
    }
  </script>
</body>
</html>
