<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>US Data Center Map</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css" />
  <style>
    html, body { margin: 0; height: 100%; }
    #map { height: 100%; }
    #panel {
      position: absolute; top: 10px; left: 60px; z-index: 1000;
      background: #fff; padding: 12px 16px; border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0,0,0,.2); font: 14px/1.4 system-ui, sans-serif;
      max-width: 280px; max-height: 80vh; overflow-y: auto;
    }
    #panel h1 { font-size: 16px; margin: 0 0 8px; }
    #panel label { display: block; margin: 4px 0; cursor: pointer; }
    #search {
      width: 100%; box-sizing: border-box; padding: 6px 8px; margin-bottom: 8px;
      border: 1px solid #ccc; border-radius: 6px; font: 14px system-ui, sans-serif;
    }
    .swatch { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 6px; }
    #count { margin-top: 8px; font-weight: 600; }
    .leaflet-popup-content { font: 13px/1.5 system-ui, sans-serif; max-width: 280px; }
  </style>
</head>
<body>
  <div id="map"></div>
  <div id="panel">
    <h1>US Data Centers</h1>
    <input id="search" type="search" placeholder="Search name, operator, city, state..." />
    <div id="filters"></div>
    <div id="count"></div>
  </div>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>
  <script>
    const TYPE_STYLE = {
      hyperscale: { color: '#dc2626', fill: '#ef4444', label: 'Hyperscale' },
      colo:       { color: '#2563eb', fill: '#3b82f6', label: 'Colocation' },
      mixed:      { color: '#7c3aed', fill: '#8b5cf6', label: 'Mixed market' },
      enterprise: { color: '#059669', fill: '#10b981', label: 'Enterprise' }
    };

    const map = L.map('map').setView([39.5, -98.35], 4);
    L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
      attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors',
      maxZoom: 19
    }).addTo(map);

    const clusters = L.markerClusterGroup();
    const layers = {};        // type -> layer group (holds that type's markers)
    const markers = [];       // { marker, type, text } for search
    const filters = document.getElementById('filters');
    const countEl = document.getElementById('count');
    const searchEl = document.getElementById('search');

    fetch('data/centers.geojson')
      .then(r => r.json())
      .then(data => {
        data.features.forEach(f => {
          const p = f.properties;
          const type = p.type || 'colo';
          const style = TYPE_STYLE[type] || TYPE_STYLE.colo;
          if (!layers[type]) layers[type] = L.layerGroup();
          const r = p.power_mw ? Math.min(22, 7 + Math.sqrt(p.power_mw) * 0.55) : 7;
          const m = L.circleMarker([f.geometry.coordinates[1], f.geometry.coordinates[0]], {
            radius: r, color: style.color, weight: 1.5, fillColor: style.fill, fillOpacity: 0.75
          });
          const img = p.image_file
            ? '<img src="https://commons.wikimedia.org/wiki/Special:FilePath/' +
              p.image_file.replace(/ /g, '_') + '?width=640" ' +
              'style="width:100%;border-radius:6px;margin-bottom:6px" loading="lazy" ' +
              'alt="' + p.name + '" onerror="this.remove()">' +
              '<small>Photo: Wikimedia Commons</small><br>'
            : '';
          m.bindPopup(
            img +
            '<b>' + p.name + '</b><br>' +
            p.city + ', ' + p.state + ' &middot; ' + style.label + '<br>' +
            '<b>Operators:</b> ' + (p.operator || 'n/a') + '<br>' +
            (p.power_mw ? '<b>Power:</b> ' + p.power_mw.toLocaleString() + ' MW <small>(' + p.power_basis + ')</small><br>' : '') +
            (p.note ? '<i>' + p.note + '</i><br>' : '') +
            '<small>Source: ' + p.source + '</small>'
          );
          layers[type].addLayer(m);
          markers.push({
            marker: m, type, source: p.source || 'other',
            text: (p.name + ' ' + (p.operator || '') + ' ' + p.city + ' ' + p.state + ' ' + type + ' ' + (p.source || '')).toLowerCase()
          });
        });
        Object.values(layers).forEach(g => clusters.addLayer(g));
        map.addLayer(clusters);
        Object.keys(TYPE_STYLE).forEach(type => {
          if (!layers[type]) return;
          const label = document.createElement('label');
          label.innerHTML = '<input type="checkbox" checked data-type="' + type + '">' +
            '<span class="swatch" style="background:' + TYPE_STYLE[type].fill + '"></span>' + TYPE_STYLE[type].label;
          filters.appendChild(label);
        });
        const srcHead = document.createElement('div');
        srcHead.innerHTML = '<b style="display:block;margin-top:8px">Sources</b>';
        filters.appendChild(srcHead);
        [...new Set(markers.map(m => m.source))].sort().forEach(src => {
          const label = document.createElement('label');
          label.innerHTML = '<input type="checkbox" checked data-source="' + src + '"> ' + src;
          filters.appendChild(label);
        });
        filters.addEventListener('change', applyFilters);
        searchEl.addEventListener('input', () => { applyFilters(); zoomToFirstMatch(); });
        applyFilters();
      });

    function query() { return searchEl.value.trim().toLowerCase(); }

    function typeEnabled(type) {
      const cb = document.querySelector('input[data-type="' + type + '"]');
      return !cb || cb.checked;
    }

    function sourceEnabled(src) {
      const cb = document.querySelector('input[data-source="' + src + '"]');
      return !cb || cb.checked;
    }

    function applyFilters() {
      const q = query();
      let visible = 0;
      Object.entries(layers).forEach(([type, group]) => {
        group.clearLayers();
        if (!typeEnabled(type)) return;
        markers.filter(m => m.type === type && sourceEnabled(m.source) && (!q || m.text.includes(q)))
               .forEach(m => { group.addLayer(m.marker); visible++; });
      });
      countEl.textContent = visible + ' of ' + markers.length + ' locations shown';
    }

    function zoomToFirstMatch() {
      const q = query();
      if (!q) return;
      const hit = markers.find(m => typeEnabled(m.type) && sourceEnabled(m.source) && m.text.includes(q));
      if (hit) {
        const ll = hit.marker.getLatLng();
        map.setView(ll, Math.max(map.getZoom(), 8));
        hit.marker.openPopup();
      }
    }
  </script>
</body>
</html>
