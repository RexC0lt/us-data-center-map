<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>US Data Center Map</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css" />
  <style>
    html, body { margin: 0; height: 100%; }
    #map { height: 100%; }
    #panel {
      position: absolute; top: 10px; left: 60px; z-index: 1000;
      background: #fff; padding: 12px 16px; border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0,0,0,.2); font: 14px/1.4 system-ui, sans-serif;
      max-width: 260px;
    }
    #panel h1 { font-size: 16px; margin: 0 0 8px; }
    #panel label { display: block; margin: 4px 0; cursor: pointer; }
    #count { margin-top: 8px; font-weight: 600; }
  </style>
</head>
<body>
  <div id="map"></div>
  <div id="panel">
    <h1>US Data Centers</h1>
    <div id="filters"></div>
    <div id="count"></div>
  </div>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>
  <script>
    const map = L.map('map').setView([39.5, -98.35], 4);
    L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
      attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors',
      maxZoom: 19
    }).addTo(map);

    const clusters = L.markerClusterGroup();
    const layers = {};
    const filters = document.getElementById('filters');
    const countEl = document.getElementById('count');

    fetch('data/centers.geojson')
      .then(r => r.json())
      .then(data => {
        const sources = new Set();
        data.features.forEach(f => {
          const src = f.properties.source || 'other';
          sources.add(src);
          if (!layers[src]) {
            layers[src] = L.layerGroup();
            clusters.addLayer(layers[src]);
          }
          const m = L.circleMarker([f.geometry.coordinates[1], f.geometry.coordinates[0]], {
            radius: 6, color: '#2563eb', weight: 1, fillColor: '#3b82f6', fillOpacity: 0.7
          });
          m.bindPopup(
            '<b>' + (f.properties.name || 'Unnamed') + '</b><br>' +
            (f.properties.operator ? 'Operator: ' + f.properties.operator + '<br>' : '') +
            (f.properties.city ? 'City: ' + f.properties.city + '<br>' : '') +
            'Source: ' + src
          );
          layers[src].addLayer(m);
        });
        map.addLayer(clusters);
        sources.forEach(src => {
          const label = document.createElement('label');
          label.innerHTML = '<input type="checkbox" checked data-src="' + src + '"> ' + src;
          filters.appendChild(label);
        });
        filters.addEventListener('change', e => {
          const src = e.target.dataset.src;
          if (!src) return;
          if (e.target.checked) clusters.addLayer(layers[src]);
          else clusters.removeLayer(layers[src]);
          updateCount();
        });
        updateCount();
      });

    function updateCount() {
      countEl.textContent = Object.values(layers).reduce((a, l) => a + l.getLayers().length, 0) + ' locations';
    }
  </script>
</body>
</html>
